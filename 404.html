<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · Parag Engineering Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f8fafc;
      color: #0f172a;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .container { max-width: 480px; width: 100%; }

    .error-code {
      font-size: clamp(5rem, 20vw, 8rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      user-select: none;
    }

    .divider {
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      border-radius: 2px;
      margin: 0 auto 28px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 0.95rem;
      color: #64748b;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
    .btn-secondary {
      background: transparent;
      color: #0f172a;
      border: 1px solid rgba(15,23,42,0.15);
    }
    .btn-secondary:hover { border-color: rgba(15,23,42,0.3); background: rgba(15,23,42,0.04); transform: translateY(-1px); }

    footer {
      margin-top: 60px;
      font-size: 12px;
      color: #94a3b8;
    }
    footer a { color: #64748b; text-decoration: none; }
    footer a:hover { color: #2563eb; }
  </style>
</head>
<body>

  <div class="container">
    <div class="error-code">404</div>
    <div class="divider"></div>
    <h1>Page not found</h1>

      The page you're looking for doesn't exist or may have been moved.<br />
      Head back to the lab to explore the projects.

    <div class="actions">
      <a class="btn btn-primary" href="/parag-engineering-lab/">

        GitHub
      </a>
    </div>
  </div>

  <footer>
    <a href="/parag-engineering-lab/">Parag Engineering Lab</a>

</body>
</html>
