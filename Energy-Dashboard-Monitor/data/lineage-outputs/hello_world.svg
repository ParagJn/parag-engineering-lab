<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0d1117"/>
  <g style="filter: url(#neon-glow);">
    <line x1="70" y1="65" x2="410" y2="65" stroke="#39ff14" stroke-width="1.5"/>
    <text x="50%" y="50%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="bold" fill="#39ff14" text-anchor="middle" dominant-baseline="middle">Hello, World!</text>
    <line x1="70" y1="135" x2="410" y2="135" stroke="#39ff14" stroke-width="1.5"/>
  </g>
</svg>