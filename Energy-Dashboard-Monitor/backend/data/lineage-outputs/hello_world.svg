<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0d1117" />
  <g filter="url(#neon-glow)">
    <line x1="40" y1="65" x2="440" y2="65" stroke="#39ff14" stroke-width="1.5" />
    <line x1="40" y1="135" x2="440" y2="135" stroke="#39ff14" stroke-width="1.5" />
    <text
      x="50%"
      y="50%"
      fill="#39ff14"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="48"
      font-weight="bold"
      text-anchor="middle"
      dominant-baseline="middle">
      Hello, World!
    </text>
  </g>
</svg>