<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Launcher</title>
<link rel="icon" href="public/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="public/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="public/favicon-16.png">
<link rel="apple-touch-icon" href="public/apple-touch-icon.png">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1b1f27; --muted: #667085;
    --border: #e3e6ec; --accent: #3b6cf6; --up: #1fa65a; --down: #d64545; --off: #9aa3b2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e8ebf1; --muted: #9aa3b2;
      --border: #2a303b; --accent: #7a9cff; --up: #3ddc84; --down: #ff6b6b; --off: #5b6372;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  /* Banner scales with the page width, keeping its aspect ratio. On narrow screens the
     wide banner's text gets too small to read, so it swaps to the logo + title instead. */
  .banner { margin-bottom: 28px; border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border); background: #fff; }
  .banner img { display: block; width: 100%; height: auto; }
  .brand { display: none; align-items: center; gap: 14px; margin-bottom: 20px; }
  .brand img { width: 56px; height: 56px; object-fit: contain; border-radius: 12px; }
  .brand strong { font-size: 20px; letter-spacing: -0.01em; }
  .brand span { display: block; color: var(--muted); font-size: 13px; }
  @media (max-width: 600px) {
    .banner { display: none; }
    .brand { display: flex; }
  }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end;
           justify-content: space-between; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  #search { padding: 9px 12px; width: 240px; max-width: 100%; border-radius: 8px;
            border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; }
  #search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
       color: var(--muted); margin: 28px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  a.card { display: block; background: var(--card); border: 1px solid var(--border);
           border-radius: 12px; padding: 16px 18px; text-decoration: none; color: inherit;
           transition: transform .12s, border-color .12s; }
  a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
  a.card.disabled { opacity: .55; }
  .top { display: flex; align-items: center; gap: 12px; }
  /* Icons sit on a white tile so dark logos stay visible in dark mode. */
  .icon { width: 40px; height: 40px; flex: none; border-radius: 10px; background: #fff;
          border: 1px solid var(--border); display: grid; place-items: center; overflow: hidden; }
  .icon img { width: 26px; height: 26px; object-fit: contain; display: block; }
  .icon.fallback { background: var(--accent); border-color: transparent; color: #fff; font-weight: 700; font-size: 17px; }
  .top .dot { margin-left: auto; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.up { background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 25%, transparent); }
  .dot.down { background: var(--down); }
  .name { font-weight: 600; font-size: 16px; }
  .sub { color: var(--muted); margin: 8px 0 10px; font-size: 13.5px; }
  .meta { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
  .empty, .error { color: var(--muted); padding: 24px 0; }
  .error { color: var(--down); }
</style>
</head>
<body>
<main>
  <div class="banner">
    <img src="public/Pj-banner.png" alt="Parag Jain: Ideas | Technology | Real Impact" width="1632" height="389">
  </div>
  <div class="brand">
    <img src="public/Pj-Logo.png" alt="PJ logo">
    <div><strong>Parag Jain</strong><span>Ideas | Technology | Real Impact</span></div>
  </div>
  <header>
    <div>
      <h1 id="title">Lab Launcher</h1>
      <p id="subtitle"></p>
    </div>
    <input id="search" type="search" placeholder="Search apps…" autocomplete="off">
  </header>
  <div id="content"></div>
</main>

<script>
const POLL_MS = 4000;
const TIMEOUT_MS = 2500;
let config = null;

// A no-cors fetch can't read the response, but it resolves if something is listening
// and rejects if the connection is refused, which is all a status dot needs.
async function isUp(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    await fetch(url, { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
    return true;
  } catch {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Card icon from config.json's "icon" path. Falls back to the app's first letter if it is
// missing or fails to load, so a bad path never leaves a broken-image box.
function makeIcon(a) {
  const tile = el("span", "icon");
  const letter = () => { tile.classList.add("fallback"); tile.replaceChildren(document.createTextNode((a.name || "?")[0].toUpperCase())); };
  if (!a.icon) { letter(); return tile; }
  const img = document.createElement("img");
  img.src = a.icon; img.alt = ""; img.loading = "lazy";
  img.addEventListener("error", letter);
  tile.append(img);
  return tile;
}

function render(filter = "") {
  const content = document.getElementById("content");
  content.replaceChildren();
  const q = filter.trim().toLowerCase();
  const apps = config.apps.filter(a =>
    !q || [a.name, a.subtitle, a.group].join(" ").toLowerCase().includes(q));
  if (!apps.length) { content.append(el("div", "empty", "No apps match.")); return; }

  const groups = new Map();
  for (const a of apps) {
    const g = a.group || "Apps";
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(a);
  }
  for (const [name, items] of groups) {
    content.append(el("h2", null, name));
    const grid = el("div", "grid");
    for (const a of items) {
      const card = el("a", "card" + (a.enabled === false ? " disabled" : ""));
      card.href = a.url; card.target = "_blank"; card.rel = "noopener";
      card.dataset.url = a.url;
      const top = el("div", "top");
      top.append(makeIcon(a), el("span", "name", a.name), el("span", "dot"));
      const meta = el("div", "meta");
      meta.append(el("span", null, a.url.replace(/^https?:\/\//, "")),
                  el("span", null, a.enabled === false ? "not started by start.sh" : ""));
      card.append(top, el("div", "sub", a.subtitle || ""), meta);
      grid.append(card);
    }
    content.append(grid);
  }
  poll();
}

async function poll() {
  const cards = [...document.querySelectorAll("a.card")];
  await Promise.all(cards.map(async c => {
    const up = await isUp(c.dataset.url);
    c.querySelector(".dot").className = "dot " + (up ? "up" : "down");
  }));
}

async function init() {
  try {
    const res = await fetch("config.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    config = await res.json();
  } catch (e) {
    document.getElementById("content").append(
      el("div", "error", "Could not load config.json (" + e.message + "). Open this page through start.sh, not as a file."));
    return;
  }
  document.getElementById("title").textContent = config.title || "Lab Launcher";
  document.getElementById("subtitle").textContent = config.subtitle || "";
  document.title = config.title || "Lab Launcher";
  const search = document.getElementById("search");
  search.addEventListener("input", () => render(search.value));
  render();
  setInterval(poll, POLL_MS);
}
init();
</script>
</body>
</html>
