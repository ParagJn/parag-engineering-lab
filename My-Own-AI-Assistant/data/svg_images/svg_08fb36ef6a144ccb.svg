<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a26b"/>
      <stop offset="1" stop-color="#a8642e"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e9ee"/>
      <stop offset="1" stop-color="#9aa3ae"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
    <linearGradient id="report" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#2f5fc4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.18"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <path id="p1" d="M200,170 C245,170 235,305 280,305"/>
    <path id="p2" d="M200,260 C245,260 235,305 280,305"/>
    <path id="p3" d="M200,350 C245,350 235,305 280,305"/>
    <path id="p4" d="M200,440 C245,440 235,305 280,305"/>
    <path id="pbs" d="M440,305 L520,305"/>
    <path id="psg" d="M680,305 L760,305"/>
    <path id="pr1" d="M920,305 C965,305 955,190 1000,190"/>
    <path id="pr2" d="M920,305 L1000,305"/>
    <path id="pr3" d="M920,305 C965,305 955,420 1000,420"/>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>
  <rect width="1200" height="620" fill="#f6f8fb"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Medallion Architecture — Data Flow</text>
  <text x="600" y="76" text-anchor="middle" font-size="14" fill="#6b7280">Sources → Bronze (raw) → Silver (clean) → Gold (business) → Reports</text>

  <!-- Column headers -->
  <g font-size="12" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="1.5">
    <text x="125" y="122">SOURCES</text>
    <text x="360" y="122">INGEST</text>
    <text x="600" y="122">REFINE</text>
    <text x="840" y="122">AGGREGATE</text>
    <text x="1080" y="122">SERVE</text>
  </g>

  <!-- Connector lines -->
  <g fill="none" stroke="#c7cdd6" stroke-width="2.5" stroke-dasharray="6 6">
    <use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/>
    <use href="#pbs"/><use href="#psg"/>
    <use href="#pr1"/><use href="#pr2"/><use href="#pr3"/>
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
  </g>

  <!-- Sources -->
  <g filter="url(#shadow)">
    <g transform="translate(50,140)">
      <rect width="150" height="60" rx="10" fill="#fff" stroke="#d1d5db"/>
      <ellipse cx="28" cy="20" rx="12" ry="5" fill="#64748b"/>
      <path d="M16,20 v18 a12,5 0 0 0 24,0 v-18" fill="#64748b"/>
      <ellipse cx="28" cy="20" rx="12" ry="5" fill="#94a3b8"/>
      <text x="52" y="28" font-size="14" font-weight="600" fill="#1f2937">CRM</text>
      <text x="52" y="44" font-size="11" fill="#6b7280">Database</text>
    </g>
    <g transform="translate(50,230)">
      <rect width="150" height="60" rx="10" fill="#fff" stroke="#d1d5db"/>
      <ellipse cx="28" cy="20" rx="12" ry="5" fill="#64748b"/>
      <path d="M16,20 v18 a12,5 0 0 0 24,0 v-18" fill="#64748b"/>
      <ellipse cx="28" cy="20" rx="12" ry="5" fill="#94a3b8"/>
      <text x="52" y="28" font-size="14" font-weight="600" fill="#1f2937">ERP</text>
      <text x="52" y="44" font-size="11" fill="#6b7280">Transactions</text>
    </g>
    <g transform="translate(50,320)">
      <rect width="150" height="60" rx="10" fill="#fff" stroke="#d1d5db"/>
      <circle cx="28" cy="30" r="5" fill="#64748b"/>
      <path d="M18,20 a14,14 0 0 1 20,0 M14,15 a20,20 0 0 1 28,0" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
      <text x="52" y="28" font-size="14" font-weight="600" fill="#1f2937">IoT</text>
      <text x="52" y="44" font-size="11" fill="#6b7280">Streams</text>
    </g>
    <g transform="translate(50,410)">
      <rect width="150" height="60" rx="10" fill="#fff" stroke="#d1d5db"/>
      <rect x="17" y="14" width="22" height="30" rx="3" fill="#94a3b8"/>
      <path d="M21,22 h14 M21,28 h14 M21,34 h9" stroke="#fff" stroke-width="2"/>
      <text x="52" y="28" font-size="14" font-weight="600" fill="#1f2937">Files / Logs</text>
      <text x="52" y="44" font-size="11" fill="#6b7280">CSV, JSON</text>
    </g>
  </g>

  <!-- Bronze Layer -->
  <g filter="url(#shadow)">
    <rect x="280" y="140" width="160" height="330" rx="14" fill="#fff" stroke="#c98a52" stroke-width="2"/>
    <path d="M280,154 a14,14 0 0 1 14,-14 h132 a14,14 0 0 1 14,14 v46 h-160 z" fill="url(#bronze)"/>
    <circle cx="306" cy="170" r="13" fill="#fbe3cc" stroke="#8a4f20" stroke-width="2"/>
    <text x="306" y="175" text-anchor="middle" font-size="13" font-weight="800" fill="#8a4f20">3</text>
    <text x="326" y="167" font-size="17" font-weight="700" fill="#fff">BRONZE</text>
    <text x="326" y="186" font-size="11" fill="#fff5ea">Raw Ingestion</text>
  </g>
  <g font-size="12" fill="#4b5563">
    <text x="298" y="232">• Raw / as-is data</text>
    <text x="298" y="254">• Append-only</text>
    <text x="298" y="276">• Full history</text>
  </g>
  <!-- messy table -->
  <g transform="translate(300,300)">
    <rect width="120" height="100" rx="6" fill="#fdf3ea" stroke="#e6c3a3"/>
    <rect x="8" y="10" width="70" height="8" rx="2" fill="#d99a63"/>
    <rect x="8" y="26" width="98" height="8" rx="2" fill="#e9b98e"/>
    <rect x="8" y="42" width="50" height="8" rx="2" fill="#d99a63"/>
    <rect x="8" y="58" width="88" height="8" rx="2" fill="#e9b98e"/>
    <rect x="8" y="74" width="62" height="8" rx="2" fill="#d99a63">
      <animate attributeName="width" values="20;62;62" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="360" y="440" text-anchor="middle" font-size="11" font-weight="600" fill="#a8642e">Delta / Parquet</text>

  <!-- Silver Layer -->
  <g filter="url(#shadow)">
    <rect x="520" y="140" width="160" height="330" rx="14" fill="#fff" stroke="#9aa3ae" stroke-width="2"/>
    <path d="M520,154 a14,14 0 0 1 14,-14 h132 a14,14 0 0 1 14,14 v46 h-160 z" fill="url(#silver)"/>
    <circle cx="546" cy="170" r="13" fill="#f8fafc" stroke="#4b5563" stroke-width="2"/>
    <text x="546" y="175" text-anchor="middle" font-size="13" font-weight="800" fill="#4b5563">2</text>
    <text x="566" y="167" font-size="17" font-weight="700" fill="#374151">SILVER</text>
    <text x="566" y="186" font-size="11" fill="#4b5563">Cleansed &amp; Conformed</text>
  </g>
  <g font-size="12" fill="#4b5563">
    <text x="538" y="232">• Deduplicated</text>
    <text x="538" y="254">• Validated &amp; typed</text>
    <text x="538" y="276">• Joined / enriched</text>
  </g>
  <g transform="translate(540,300)">
    <rect width="120" height="100" rx="6" fill="#f3f5f8" stroke="#cfd5dc"/>
    <rect x="0" y="0" width="120" height="18" rx="6" fill="#b8c0ca"/>
    <g stroke="#d7dce3"><path d="M0,38 h120 M0,58 h120 M0,78 h120 M40,18 v82 M80,18 v82"/></g>
    <rect x="0" y="18" width="120" height="20" fill="#dbe3ee" opacity="0.8">
      <animate attributeName="y" values="18;38;58;78;18" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- spinning gear-like ring -->
  <circle cx="600" cy="435" r="11" fill="none" stroke="#7b8591" stroke-width="4" stroke-dasharray="5 4">
    <animateTransform attributeName="transform" type="rotate" from="0 600 435" to="360 600 435" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="435" r="4" fill="#7b8591"/>

  <!-- Gold Layer -->
  <g filter="url(#shadow)">
    <rect x="760" y="140" width="160" height="330" rx="14" fill="#fff" stroke="#d4a017" stroke-width="2"/>
    <path d="M760,154 a14,14 0 0 1 14,-14 h132 a14,14 0 0 1 14,14 v46 h-160 z" fill="url(#gold)"/>
    <circle cx="786" cy="170" r="13" fill="#fff8dc" stroke="#8a6500" stroke-width="2"/>
    <text x="786" y="175" text-anchor="middle" font-size="13" font-weight="800" fill="#8a6500">1</text>
    <text x="806" y="167" font-size="17" font-weight="700" fill="#5c4300">GOLD</text>
    <text x="806" y="186" font-size="11" fill="#6b5200">Business-Ready</text>
  </g>
  <g font-size="12" fill="#4b5563">
    <text x="778" y="232">• Aggregated KPIs</text>
    <text x="778" y="254">• Star schema / marts</text>
    <text x="778" y="276">• Curated for BI &amp; ML</text>
  </g>
  <!-- mini star schema -->
  <g transform="translate(840,352)">
    <g stroke="#e0b73a" stroke-width="2">
      <line x1="0" y1="0" x2="-42" y2="-32"/><line x1="0" y1="0" x2="42" y2="-32"/>
      <line x1="0" y1="0" x2="-42" y2="32"/><line x1="0" y1="0" x2="42" y2="32"/>
    </g>
    <rect x="-18" y="-13" width="36" height="26" rx="4" fill="#f5c542"/>
    <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="700" fill="#5c4300">FACT</text>
    <g fill="#fff3c4" stroke="#e0b73a">
      <rect x="-56" y="-44" width="28" height="18" rx="3"/><rect x="28" y="-44" width="28" height="18" rx="3"/>
      <rect x="-56" y="26" width="28" height="18" rx="3"/><rect x="28" y="26" width="28" height="18" rx="3"/>
    </g>
    <rect x="-18" y="-13" width="36" height="26" rx="4" fill="none" stroke="#f5c542" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="840" y="440" text-anchor="middle" font-size="11" font-weight="600" fill="#b08600">Semantic Model</text>

  <!-- Reports -->
  <g filter="url(#shadow)">
    <g transform="translate(1000,150)">
      <rect width="160" height="80" rx="10" fill="#fff" stroke="#bcd0f7"/>
      <rect x="12" y="14" width="44" height="52" rx="6" fill="#eaf1ff"/>
      <rect x="18" y="44" width="8" height="16" fill="#5b8def">
        <animate attributeName="height" values="16;30;16" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="44;30;44" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="30" y="34" width="8" height="26" fill="#2f5fc4">
        <animate attributeName="height" values="26;14;26" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="34;46;34" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="42" y="26" width="8" height="34" fill="#5b8def">
        <animate attributeName="height" values="34;22;38;34" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="26;38;22;26" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="66" y="36" font-size="14" font-weight="600" fill="#1f2937">Dashboards</text>
      <text x="66" y="54" font-size="11" fill="#6b7280">Power BI / Tableau</text>
    </g>
    <g transform="translate(1000,265)">
      <rect width="160" height="80" rx="10" fill="#fff" stroke="#bcd0f7"/>
      <rect x="12" y="14" width="44" height="52" rx="6" fill="#eaf1ff"/>
      <polyline points="18,56 28,44 36,50 50,26" fill="none" stroke="#2f5fc4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="50">
        <animate attributeName="stroke-dashoffset" values="50;0;0" dur="2.4s" repeatCount="indefinite"/>
      </polyline>
      <text x="66" y="36" font-size="14" font-weight="600" fill="#1f2937">KPI Reports</text>
      <text x="66" y="54" font-size="11" fill="#6b7280">Finance, Sales</text>
    </g>
    <g transform="translate(1000,380)">
      <rect width="160" height="80" rx="10" fill="#fff" stroke="#bcd0f7"/>
      <rect x="12" y="14" width="44" height="52" rx="6" fill="#eaf1ff"/>
      <g fill="#5b8def">
        <circle cx="22" cy="28" r="4"/><circle cx="22" cy="52" r="4"/>
        <circle cx="46" cy="40" r="4"/>
      </g>
      <path d="M22,28 L46,40 L22,52 M22,28 L22,52" stroke="#2f5fc4" stroke-width="1.5" fill="none"/>
      <circle cx="46" cy="40" r="4" fill="none" stroke="#2f5fc4" stroke-width="2">
        <animate attributeName="r" values="4;10;4" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="66" y="36" font-size="14" font-weight="600" fill="#1f2937">Analytics / ML</text>
      <text x="66" y="54" font-size="11" fill="#6b7280">Forecasts, Models</text>
    </g>
  </g>

  <!-- Data packets: raw from sources -->
  <g>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#94a3b8"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion></rect>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#64748b"><animateMotion dur="2.4s" repeatCount="indefinite" begin="-1.2s"><mpath href="#p1"/></animateMotion></rect>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#a3a3a3"><animateMotion dur="2.4s" repeatCount="indefinite" begin="-0.6s"><mpath href="#p2"/></animateMotion></rect>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#64748b"><animateMotion dur="2.4s" repeatCount="indefinite" begin="-1.8s"><mpath href="#p2"/></animateMotion></rect>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#94a3b8"><animateMotion dur="2.4s" repeatCount="indefinite" begin="-0.3s"><mpath href="#p3"/></animateMotion></rect>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#78716c"><animateMotion dur="2.4s" repeatCount="indefinite" begin="-1.5s"><mpath href="#p3"/></animateMotion></rect>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#64748b"><animateMotion dur="2.4s" repeatCount="indefinite" begin="-0.9s"><mpath href="#p4"/></animateMotion></rect>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#a3a3a3"><animateMotion dur="2.4s" repeatCount="indefinite" begin="-2.1s"><mpath href="#p4"/></animateMotion></rect>
  </g>

  <!-- Bronze -> Silver -->
  <g filter="url(#glow)">
    <circle r="7" fill="#c07a3e" stroke="#fff" stroke-width="2"><animateMotion dur="1.2s" repeatCount="indefinite" begin="0s"><mpath href="#pbs"/></animateMotion></circle>
    <circle r="7" fill="#c07a3e" stroke="#fff" stroke-width="2"><animateMotion dur="1.2s" repeatCount="indefinite" begin="-0.6s"><mpath href="#pbs"/></animateMotion></circle>
  </g>
  <!-- Silver -> Gold -->
  <g filter="url(#glow)">
    <circle r="7" fill="#9aa3ae" stroke="#fff" stroke-width="2"><animateMotion dur="1.2s" repeatCount="indefinite" begin="-0.3s"><mpath href="#psg"/></animateMotion></circle>
    <circle r="7" fill="#9aa3ae" stroke="#fff" stroke-width="2"><animateMotion dur="1.2s" repeatCount="indefinite" begin="-0.9s"><mpath href="#psg"/></animateMotion></circle>
  </g>
  <!-- Gold -> Reports -->
  <g filter="url(#glow)">
    <path d="M0,-8 L8,0 L0,8 L-8,0 Z" fill="#f2b705" stroke="#fff" stroke-width="1.5"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0s"><mpath href="#pr1"/></animateMotion></path>
    <path d="M0,-8 L8,0 L0,8 L-8,0 Z" fill="#f2b705" stroke="#fff" stroke-width="1.5"><animateMotion dur="1.8s" repeatCount="indefinite" begin="-0.6s"><mpath href="#pr2"/></animateMotion></path>
    <path d="M0,-8 L8,0 L0,8 L-8,0 Z" fill="#f2b705" stroke="#fff" stroke-width="1.5"><animateMotion dur="1.8s" repeatCount="indefinite" begin="-1.2s"><mpath href="#pr3"/></animateMotion></path>
  </g>

  <!-- Pipeline progress bar -->
  <g transform="translate(50,520)">
    <rect width="1110" height="10" rx="5" fill="#e5e7eb"/>
    <rect width="1110" height="10" rx="5" fill="url(#bronze)" opacity="0">
      <animate attributeName="opacity" values="0;0" dur="1s"/>
    </rect>
    <rect x="0" width="0" height="10" rx="5" fill="#5b8def">
      <animate attributeName="width" values="0;1110;1110" keyTimes="0;0.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <g font-size="12" font-weight="600" text-anchor="middle">
      <text x="75" y="34" fill="#64748b">Extract</text>
      <text x="310" y="34" fill="#a8642e">Ingest raw</text>
      <text x="550" y="34" fill="#6b7280">Clean &amp; conform</text>
      <text x="790" y="34" fill="#b08600">Aggregate</text>
      <text x="1030" y="34" fill="#2f5fc4">Serve insights</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(360,590)" font-size="11" fill="#6b7280">
    <rect x="0" y="-9" width="10" height="10" rx="2" fill="#94a3b8"/><text x="16" y="0">raw record</text>
    <circle cx="110" cy="-4" r="5" fill="#c07a3e"/><text x="120" y="0">bronze data</text>
    <circle cx="215" cy="-4" r="5" fill="#9aa3ae"/><text x="225" y="0">silver data</text>
    <path d="M320,-10 L326,-4 L320,2 L314,-4 Z" fill="#f2b705"/><text x="332" y="0">gold insight</text>
  </g>
</svg>