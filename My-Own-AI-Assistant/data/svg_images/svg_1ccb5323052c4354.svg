<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#f2f6fb"/>
    </linearGradient>
    <linearGradient id="src" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffdf1"/><stop offset="1" stop-color="#fff7d6"/>
    </linearGradient>
    <linearGradient id="adf" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f7f3ff"/><stop offset="1" stop-color="#eee9ff"/>
    </linearGradient>
    <linearGradient id="net" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff8f2"/><stop offset="1" stop-color="#ffede0"/>
    </linearGradient>
    <linearGradient id="snet" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f0fffb"/><stop offset="1" stop-color="#e0f8f1"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#26364a" flood-opacity=".12"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Fixed-size arrowheads (userSpaceOnUse) whose tip sits exactly at the path end -->
    <marker id="blueArrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1477ed"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0bb58a"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" markerWidth="15" markerHeight="15" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ff9800"/>
    </marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7251e8"/>
    </marker>

    <style>
      .h{font:700 24px Arial,sans-serif;fill:#14284b}
      .t{font:700 21px Arial,sans-serif;fill:#14284b}
      .b{font:16px Arial,sans-serif;fill:#42536c}
      .s{font:14px Arial,sans-serif;fill:#53647a}
      .m{font:15px "Courier New",monospace;fill:#233b62}
      .num{font:700 20px Arial,sans-serif;fill:#fff}
      .flowlabel{font:700 16px Arial,sans-serif;fill:#233b62}
      .card{fill:#fff;stroke:#e0e7f0;stroke-width:1.5}
      .pill{fill:#fff;fill-opacity:.92;stroke:#dde5ef;stroke-width:1}
      .flow{fill:none;stroke-linecap:round;animation:dash 2.4s linear infinite}
      .ctrl{fill:none;stroke-linecap:round;animation:dash2 2.8s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-21}}
      @keyframes dash2{to{stroke-dashoffset:-14}}
      .blob{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite alternate}
      @keyframes pulse{from{transform:scale(.85);opacity:.6}to{transform:scale(1.15);opacity:1}}
    </style>
  </defs>

  <rect width="1920" height="900" fill="#ffffff"/>
  <rect width="1920" height="900" fill="url(#bg)"/>

  <!-- ============ 1. Source ============ -->
  <rect x="25" y="50" width="430" height="510" rx="22" fill="url(#src)" stroke="#f3d56b" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="70" cy="95" r="25" fill="#ffb300"/>
  <text x="70" y="102" text-anchor="middle" class="num">1</text>
  <text x="110" y="103" class="h">DnA Platform (Source)</text>

  <!-- Config card (feeds Master pipeline) -->
  <rect x="55" y="150" width="370" height="100" rx="16" class="card" filter="url(#shadow)"/>
  <ellipse cx="105" cy="178" rx="27" ry="8" fill="#eadfff" stroke="#7650e8" stroke-width="2"/>
  <path d="M78 178v36c0 12 54 12 54 0v-36" fill="#eadfff" stroke="#7650e8" stroke-width="2"/>
  <text x="145" y="190" class="t">Migration Config</text>
  <text x="145" y="218" class="s">• MIGRATION_INTERFACE_CONFIG</text>

  <!-- Historical data card (feeds Worker pipeline) -->
  <rect x="55" y="270" width="370" height="150" rx="16" class="card" filter="url(#shadow)"/>
  <ellipse cx="105" cy="305" rx="27" ry="8" fill="#dce9fa" stroke="#1264c4" stroke-width="2"/>
  <path d="M78 305v38c0 12 54 12 54 0v-38" fill="#dce9fa" stroke="#1264c4" stroke-width="2"/>
  <text x="145" y="310" class="t">DnA Historical</text>
  <text x="145" y="336" class="t">Source Data</text>
  <text x="145" y="362" class="b">Curated / Interface Objects</text>
  <text x="145" y="386" class="s">(INF7772, INF7748, INF7750, etc.)</text>

  <!-- Audit log card (feeds CSV report) -->
  <rect x="55" y="440" width="370" height="100" rx="16" class="card" filter="url(#shadow)"/>
  <ellipse cx="105" cy="466" rx="27" ry="8" fill="#ffeccc" stroke="#e08600" stroke-width="2"/>
  <path d="M78 466v36c0 12 54 12 54 0v-36" fill="#ffeccc" stroke="#e08600" stroke-width="2"/>
  <text x="145" y="480" class="t">Migration Audit Log</text>
  <text x="145" y="508" class="s">• MIGRATION_AUDIT_LOG</text>

  <!-- ============ 2. ADF ============ -->
  <rect x="555" y="50" width="475" height="510" rx="22" fill="url(#adf)" stroke="#c8b8ff" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="600" cy="95" r="25" fill="#7251e8"/>
  <text x="600" y="102" text-anchor="middle" class="num">2</text>
  <text x="640" y="103" class="h">Azure Data Factory</text>
  <text x="640" y="130" class="b">(ADF Orchestration)</text>

  <rect x="585" y="150" width="415" height="100" rx="16" class="card" filter="url(#shadow)"/>
  <circle cx="625" cy="200" r="18" fill="#e4edff" stroke="#7251e8" stroke-width="2"/>
  <path d="M617 200h16M625 192v16" stroke="#7251e8" stroke-width="3"/>
  <text x="660" y="194" class="t">Master Pipeline</text>
  <text x="660" y="224" class="m">PL_DNA_SNET_HIST_MIGRATION_MASTER</text>

  <rect x="585" y="285" width="415" height="120" rx="16" class="card" filter="url(#shadow)"/>
  <circle cx="625" cy="330" r="18" fill="#e4edff" stroke="#1477ed" stroke-width="2"/>
  <path d="M617 330h16M625 322v16" stroke="#1477ed" stroke-width="3"/>
  <text x="660" y="332" class="t">Worker Pipeline</text>
  <text x="660" y="360" class="m">PL_DNA_SNET_HIST_MIGRATION_WORKER</text>
  <text x="660" y="384" class="s">(Parameterized Copy Activity)</text>

  <!-- Master -> Worker (orchestration) -->
  <path d="M792 252 V283" stroke="#7251e8" stroke-width="3" fill="none" marker-end="url(#purpleArrow)"/>
  <text x="808" y="273" class="s" font-weight="700" fill="#5a3fd0">Triggers slice iterations</text>

  <!-- ============ 3. Network / SHIR ============ -->
  <rect x="1130" y="50" width="365" height="510" rx="22" fill="url(#net)" stroke="#ffc18d" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1175" cy="95" r="25" fill="#ff7a00"/>
  <text x="1175" y="102" text-anchor="middle" class="num">3</text>
  <text x="1215" y="96" class="h">Network Boundary /</text>
  <text x="1215" y="124" class="b">Integration Runtime</text>

  <rect x="1160" y="150" width="305" height="260" rx="16" class="card" filter="url(#shadow)"/>
  <rect x="1190" y="178" width="48" height="68" rx="6" fill="#42536c"/>
  <rect x="1198" y="190" width="32" height="5" rx="2" fill="#7d8ca3"/>
  <rect x="1198" y="202" width="32" height="5" rx="2" fill="#7d8ca3"/>
  <circle cx="1229" cy="234" r="5" fill="#16c784"/>
  <text x="1260" y="196" class="t">Self-Hosted</text>
  <text x="1260" y="222" class="t">Integration Runtime</text>
  <text x="1260" y="248" class="t">(SHIR)</text>
  <text x="1190" y="296" class="b">• Secure / Approved Subnet</text>
  <text x="1190" y="324" class="b">• Outbound HTTPS (Port 443)</text>
  <text x="1190" y="352" class="b">• ADF Control Plane</text>

  <!-- ============ 4. SNet Target ============ -->
  <rect x="1570" y="50" width="325" height="510" rx="22" fill="url(#snet)" stroke="#9ce5d1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1615" cy="95" r="25" fill="#0bb58a"/>
  <text x="1615" y="102" text-anchor="middle" class="num">4</text>
  <text x="1655" y="102" class="h" style="font-size:20px">SNet Target Platform</text>

  <rect x="1600" y="150" width="265" height="260" rx="16" class="card" filter="url(#shadow)"/>
  <ellipse cx="1732" cy="215" rx="35" ry="10" fill="#dff8ef" stroke="#0b9f78" stroke-width="2"/>
  <path d="M1697 215v52c0 15 70 15 70 0v-52" fill="#dff8ef" stroke="#0b9f78" stroke-width="2"/>
  <path d="M1697 241c0 15 70 15 70 0" fill="none" stroke="#0b9f78" stroke-width="1.5" opacity=".6"/>
  <text x="1732" y="325" text-anchor="middle" class="t">SNET Staging</text>
  <text x="1732" y="351" text-anchor="middle" class="t">Database</text>
  <text x="1732" y="378" text-anchor="middle" class="b">STG_* Tables</text>

  <!-- ============ Flow lines (strictly left → right, card edge to card edge) ============ -->

  <!-- Config -> Master (control) -->
  <path id="cfgFlow" d="M427 200 H582" class="ctrl" stroke="#7251e8" stroke-width="3" stroke-dasharray="6 8" marker-end="url(#purpleArrow)"/>
  <rect x="455" y="162" width="100" height="24" rx="12" class="pill"/>
  <text x="505" y="179" text-anchor="middle" class="s" font-weight="700" fill="#5a3fd0">Read config</text>

  <!-- Source data -> Worker (extract) -->
  <path id="extract" d="M427 345 H582" class="flow" stroke="#1477ed" stroke-width="5" stroke-dasharray="8 13" marker-end="url(#blueArrow)"/>
  <rect x="448" y="304" width="114" height="26" rx="13" class="pill"/>
  <text x="505" y="322" text-anchor="middle" class="flowlabel">Extract data</text>
  <rect x="427" y="356" width="156" height="22" rx="11" class="pill"/>
  <text x="505" y="372" text-anchor="middle" class="s">(Parameterized Query)</text>

  <!-- Worker -> SHIR (copy) -->
  <path id="copyFlow" d="M1002 345 H1157" class="flow" stroke="#1477ed" stroke-width="5" stroke-dasharray="8 13" marker-end="url(#blueArrow)"/>
  <rect x="1018" y="304" width="124" height="26" rx="13" class="pill"/>
  <text x="1080" y="322" text-anchor="middle" class="flowlabel">Copy via SHIR</text>
  <rect x="1036" y="356" width="88" height="22" rx="11" class="pill"/>
  <text x="1080" y="372" text-anchor="middle" class="s">HTTPS 443</text>

  <!-- SHIR -> SNet DB (load) -->
  <path id="dbFlow" d="M1467 345 H1597" class="flow" stroke="#0bb58a" stroke-width="5" stroke-dasharray="8 13" marker-end="url(#greenArrow)"/>
  <rect x="1473" y="304" width="118" height="26" rx="13" class="pill"/>
  <text x="1532" y="322" text-anchor="middle" class="flowlabel">DB Connection</text>
  <rect x="1492" y="356" width="80" height="22" rx="11" class="pill"/>
  <text x="1532" y="372" text-anchor="middle" class="s">Port 5432</text>

  <!-- Audit Log -> CSV report -->
  <path id="auditFlow" d="M240 542 V682 Q240 702 260 702 H962" class="flow" stroke="#ff9800" stroke-width="4" stroke-dasharray="8 13" marker-end="url(#orangeArrow)"/>
  <circle cx="420" cy="702" r="24" fill="#ff9800"/>
  <text x="420" y="709" text-anchor="middle" class="num" style="font-size:18px">5</text>
  <text x="458" y="690" class="flowlabel">Audit Metrics Export</text>

  <!-- CSV -->
  <g transform="translate(965,650)">
    <rect x="0" y="0" width="85" height="105" rx="8" fill="#fff" stroke="#dbe5ee" stroke-width="2" filter="url(#shadow)"/>
    <path d="M58 0v27h27" fill="none" stroke="#0b9f78" stroke-width="3"/>
    <text x="43" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="18" fill="#0b9f78">CSV</text>
    <text x="115" y="46" class="t">CSV Files</text>
    <text x="115" y="72" class="b">(Audit Metrics Report)</text>
  </g>

  <!-- ============ Animated data packets (one direction only, slower, fewer) ============ -->
  <g filter="url(#glow)">
    <!-- Control (purple) -->
    <circle r="5" fill="#7251e8"><animateMotion dur="5s" repeatCount="indefinite" path="M427 200 H575"/></circle>
    <circle r="5" fill="#7251e8"><animateMotion dur="3s" repeatCount="indefinite" path="M792 252 V276"/></circle>

    <!-- Extract (blue) – 2 dots -->
    <circle r="7" fill="#1477ed"><animateMotion dur="5s" repeatCount="indefinite" path="M427 345 H572"/></circle>
    <circle r="7" fill="#1477ed"><animateMotion begin="2.5s" dur="5s" repeatCount="indefinite" path="M427 345 H572"/></circle>

    <!-- Copy via SHIR (blue) – 2 dots -->
    <circle r="7" fill="#1477ed"><animateMotion dur="5s" repeatCount="indefinite" path="M1002 345 H1147"/></circle>
    <circle r="7" fill="#1477ed"><animateMotion begin="2.5s" dur="5s" repeatCount="indefinite" path="M1002 345 H1147"/></circle>

    <!-- Load (green) – 2 dots -->
    <circle r="7" fill="#0bb58a"><animateMotion dur="4.5s" repeatCount="indefinite" path="M1467 345 H1587"/></circle>
    <circle r="7" fill="#0bb58a"><animateMotion begin="2.25s" dur="4.5s" repeatCount="indefinite" path="M1467 345 H1587"/></circle>

    <!-- Audit (orange) – 2 dots -->
    <circle r="6" fill="#ff9800"><animateMotion dur="7s" repeatCount="indefinite" path="M240 542 V682 Q240 702 260 702 H952"/></circle>
    <circle r="6" fill="#ff9800"><animateMotion begin="3.5s" dur="7s" repeatCount="indefinite" path="M240 542 V682 Q240 702 260 702 H952"/></circle>
  </g>

  <!-- Origin pulse points (sources only) -->
  <circle cx="427" cy="200" r="4" fill="#7251e8" class="blob"/>
  <circle cx="427" cy="345" r="5" fill="#1477ed" class="blob"/>
  <circle cx="1002" cy="345" r="5" fill="#1477ed" class="blob"/>
  <circle cx="1467" cy="345" r="5" fill="#0bb58a" class="blob"/>
  <circle cx="240" cy="542" r="5" fill="#ff9800" class="blob"/>

  <!-- ============ Legend ============ -->
  <g transform="translate(1250,640)">
    <rect x="0" y="0" width="645" height="175" rx="16" class="card" filter="url(#shadow)"/>
    <text x="24" y="36" class="t" style="font-size:18px">Flow Legend (Source → Target)</text>
    <path d="M24 70 H84" stroke="#7251e8" stroke-width="3" stroke-dasharray="6 8" marker-end="url(#purpleArrow)"/>
    <text x="100" y="75" class="b">Control / orchestration</text>
    <path d="M24 110 H84" stroke="#1477ed" stroke-width="5" stroke-dasharray="8 13" marker-end="url(#blueArrow)"/>
    <text x="100" y="115" class="b">Historical data movement</text>
    <path d="M330 70 H390" stroke="#0bb58a" stroke-width="5" stroke-dasharray="8 13" marker-end="url(#greenArrow)"/>
    <text x="406" y="75" class="b">Load into SNet staging</text>
    <path d="M330 110 H390" stroke="#ff9800" stroke-width="4" stroke-dasharray="8 13" marker-end="url(#orangeArrow)"/>
    <text x="406" y="115" class="b">Audit metrics reporting</text>
    <text x="24" y="152" class="s">Path: Source Data → Worker Pipeline → SHIR → SNET Staging DB (one-way)</text>
  </g>
</svg>