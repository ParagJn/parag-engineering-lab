  <circle cx="22" cy="45" r="2" fill="#D4AF37" />
  <path d="M28 45h9" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" />

  <!-- Technology circuit detail -->
  <path
    d="M49 31h5v-4"
    fill="none"
    stroke="#D4AF37"
    stroke-width="2"
