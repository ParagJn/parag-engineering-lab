  />

  <!-- Article list -->
  <circle cx="22" cy="29" r="2" fill="#D4AF37" />
  <path d="M28 29h13" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" />

  <circle cx="22" cy="37" r="2" fill="#D4AF37" />
