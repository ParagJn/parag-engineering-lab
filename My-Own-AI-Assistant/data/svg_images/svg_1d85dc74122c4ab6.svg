<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Technology Articles</title>
  <desc id="desc">A black and gold icon showing a technology article list</desc>

  <!-- Background -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="12"
    fill="#0A0A0A"
    stroke="#D4AF37"
    stroke-width="2"
  />

  <!-- Article document -->
  <path
    d="M15 13h25l9 9v29H15V13Z"
    fill="none"
    stroke="#D4AF37"
    stroke-width="2.5"
