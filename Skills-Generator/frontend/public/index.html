<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Generator — AI Skill Generator</title>

    <!-- Tailwind CDN (dev) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        google: { blue:'#4285F4', red:'#EA4335', yellow:'#FBBC05', green:'#34A853' }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts + Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- Marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body{font-family:'Inter',system-ui,sans-serif}
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
        .sidebar::-webkit-scrollbar-thumb{background:#4b5563}
        .prose h1{font-size:1.5rem;font-weight:700;margin-bottom:.5rem;color:#111827}
        .prose h2{font-size:1.2rem;font-weight:600;margin:1.25rem 0 .5rem;color:#374151;border-bottom:1px solid #f3f4f6;padding-bottom:.35rem}
        .prose h3{font-size:1.05rem;font-weight:500;margin:.75rem 0 .25rem;color:#4b5563}
        .prose ul{list-style:disc;padding-left:1.5rem;margin:.4rem 0}
        .prose ol{list-style:decimal;padding-left:1.5rem;margin:.4rem 0}
        .prose li{margin:.15rem 0}
        .prose p{margin:.4rem 0}
        .prose strong{color:#1f2937}
        .prose hr{margin:1rem 0;border-color:#e5e7eb}
        .prose code{background:#f3f4f6;padding:0.1rem 0.35rem;border-radius:4px;font-size:0.85em}
        .prose pre{background:#1f2937;color:#e5e7eb;padding:1rem;border-radius:8px;overflow-x:auto;margin:.75rem 0}
        .prose pre code{background:transparent;padding:0;color:inherit}
        .sidebar-transition{transition:transform .25s cubic-bezier(.4,0,.2,1)}
    </style>
</head>

<body class="h-full bg-gray-50 text-gray-800">

<!-- Tailwind class safelist (hidden, ensures dynamic classes are generated) -->
<div class="hidden border-google-red border-google-blue border-google-green border-google-yellow
    bg-red-50 bg-blue-50 bg-green-50 text-red-700 text-blue-700 text-green-700
    text-google-red text-google-blue text-google-green text-google-yellow
    border-l-google-red border-l-google-blue border-l-google-green"></div>

<div class="flex h-full">

    <!-- ===== Mobile overlay ===== -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>

    <!-- ===== Sidebar ===== -->
    <aside id="sidebar" class="sidebar fixed lg:static inset-y-0 left-0 z-50 w-72 bg-gray-900 text-white flex-shrink-0 flex flex-col sidebar-transition -translate-x-full lg:translate-x-0">
        <!-- Header -->
        <div class="px-5 pt-5 pb-3 flex-shrink-0">
            <div class="flex items-center gap-3 mb-5">
                <span class="material-symbols-outlined text-google-blue" style="font-size:32px">psychology</span>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">Skills Generator</h1>
                    <p class="text-[11px] text-gray-400 tracking-wide">AI Skills Generator</p>
                </div>
            </div>
            <button onclick="showCreateView()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-google-blue hover:bg-blue-500 rounded-lg text-sm font-semibold transition-colors">
                <span class="material-symbols-outlined" style="font-size:20px">add_circle</span>
                New Skill
            </button>
        </div>

        <!-- Skills list -->
        <div class="px-5 pt-2 pb-2 flex-shrink-0">
            <div class="text-[10px] text-gray-500 uppercase tracking-widest font-semibold">Generated Skills</div>
        </div>
        <div id="skill-list" class="flex-1 overflow-y-auto px-3 pb-4 space-y-0.5"></div>
    </aside>

    <!-- ===== Main ===== -->
    <main class="flex-1 flex flex-col min-w-0">
        <!-- Top bar -->
        <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-gray-200/70 px-4 py-3 flex items-center justify-between flex-shrink-0">
            <button onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 hover:bg-gray-100 rounded-lg transition-colors">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <div class="hidden lg:block"></div>
            <div class="flex items-center gap-1.5 text-xs text-gray-400 font-medium">
                <span class="material-symbols-outlined text-google-green" style="font-size:18px">bolt</span>
                Powered by AI
            </div>
        </header>

        <!-- Scrollable content -->
        <div class="flex-1 overflow-y-auto">
            <div class="w-full max-w-full px-4 sm:px-8 lg:px-12 xl:px-16 py-8">

                <!-- ========== CREATE VIEW ========== -->
                <div id="create-view">
                    <h2 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-1">Create a New Skill</h2>
                    <p class="text-gray-500 mb-8 text-sm sm:text-base">Describe your idea and we'll generate a production-ready skill definition.</p>

                    <!-- Platform selector -->
                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-gray-700 mb-3">
                            <span class="material-symbols-outlined align-middle mr-1" style="font-size:18px">tune</span>
                            Target Platform
                        </label>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <!-- Anthropic -->
                            <label class="cursor-pointer">
                                <input type="radio" name="platform" value="anthropic" class="peer sr-only" checked>
                                <div class="p-4 border-2 border-gray-200 rounded-xl peer-checked:border-google-red peer-checked:bg-red-50/60 transition-all hover:border-gray-300">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-lg bg-orange-100 flex items-center justify-center flex-shrink-0">
                                            <span class="material-symbols-outlined text-orange-600">auto_awesome</span>
                                        </div>
                                        <div>
                                            <div class="font-semibold text-gray-900 text-sm">Anthropic</div>
                                            <div class="text-[11px] text-gray-500">Claude Sonnet</div>
                                        </div>
                                    </div>
                                </div>
                            </label>
                            <!-- Gemini -->
                            <label class="cursor-pointer">
                                <input type="radio" name="platform" value="gemini" class="peer sr-only">
                                <div class="p-4 border-2 border-gray-200 rounded-xl peer-checked:border-google-blue peer-checked:bg-blue-50/60 transition-all hover:border-gray-300">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-lg bg-blue-100 flex items-center justify-center flex-shrink-0">
                                            <span class="material-symbols-outlined text-blue-600">diamond</span>
                                        </div>
                                        <div>
                                            <div class="font-semibold text-gray-900 text-sm">Gemini</div>
                                            <div class="text-[11px] text-gray-500">Gemini 2.0 Flash</div>
                                        </div>
                                    </div>
                                </div>
                            </label>
                            <!-- ChatGPT -->
                            <label class="cursor-pointer">
                                <input type="radio" name="platform" value="chatgpt" class="peer sr-only">
                                <div class="p-4 border-2 border-gray-200 rounded-xl peer-checked:border-google-green peer-checked:bg-green-50/60 transition-all hover:border-gray-300">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-lg bg-green-100 flex items-center justify-center flex-shrink-0">
                                            <span class="material-symbols-outlined text-green-600">smart_toy</span>
                                        </div>
                                        <div>
                                            <div class="font-semibold text-gray-900 text-sm">ChatGPT</div>
                                            <div class="text-[11px] text-gray-500">GPT-4o</div>
                                        </div>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Thought input -->
                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <span class="material-symbols-outlined align-middle mr-1" style="font-size:18px">edit_note</span>
                            Your Thought Process
                        </label>
                        <textarea id="thought-input" rows="6"
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-google-blue/40 focus:border-google-blue resize-none text-gray-900 placeholder-gray-400 transition-shadow text-sm leading-relaxed"
                            placeholder="Describe your skill idea…&#10;&#10;e.g. I want a skill that structures blog posts using the AIDA framework (Attention, Interest, Desire, Action) for marketing content."></textarea>
                    </div>

                    <!-- Generate button -->
                    <button id="generate-btn" onclick="generateSkill()"
                        class="w-full sm:w-auto px-8 py-3 bg-gray-900 hover:bg-gray-800 active:bg-gray-950 text-white font-semibold rounded-xl transition-colors flex items-center justify-center gap-2 text-sm">
                        <span class="material-symbols-outlined" style="font-size:20px">auto_fix_high</span>
                        Generate Skill
                    </button>
                </div>

                <!-- ========== LOADING VIEW ========== -->
                <div id="loading-view" class="hidden">
                    <div class="flex flex-col items-center justify-center py-24 text-gray-400">
                        <svg class="animate-spin h-8 w-8 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        <span id="loading-text" class="text-sm font-medium">Generating your skill…</span>
                    </div>
                </div>

                <!-- ========== RESULT VIEW ========== -->
                <div id="result-view" class="hidden">
                    <!-- Skill card -->
                    <div id="skill-card" class="bg-white rounded-2xl shadow-sm border-l-4 border-google-blue overflow-hidden">
                        <div class="p-5 sm:p-8">
                            <!-- Header row -->
                            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-5">
                                <div class="flex items-center gap-3 min-w-0">
                                    <span id="result-platform-icon" class="material-symbols-outlined text-2xl text-google-blue flex-shrink-0">auto_awesome</span>
                                    <div class="min-w-0">
                                        <h2 id="result-skill-name" class="text-lg sm:text-xl font-bold text-gray-900 truncate"></h2>
                                        <span id="result-platform-badge" class="inline-block mt-0.5 px-2.5 py-0.5 text-[11px] font-semibold rounded-full bg-blue-50 text-blue-700"></span>
                                    </div>
                                </div>
                                <!-- Action buttons -->
                                <div class="flex items-center gap-1 flex-shrink-0">
                                    <button onclick="downloadSkill()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors group" title="Download">
                                        <span class="material-symbols-outlined text-gray-400 group-hover:text-google-green" style="font-size:22px">download</span>
                                    </button>
                                    <button onclick="regenerateSkill()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors group" title="Regenerate">
                                        <span class="material-symbols-outlined text-gray-400 group-hover:text-google-blue" style="font-size:22px">refresh</span>
                                    </button>
                                    <button onclick="archiveSkill()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors group" title="Archive">
                                        <span class="material-symbols-outlined text-gray-400 group-hover:text-google-yellow" style="font-size:22px">archive</span>
                                    </button>
                                    <button onclick="deleteSkill()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors group" title="Delete">
                                        <span class="material-symbols-outlined text-gray-400 group-hover:text-google-red" style="font-size:22px">delete</span>
                                    </button>
                                </div>
                            </div>
                            <!-- Rendered markdown -->
                            <div id="skill-content" class="prose max-w-none text-gray-700 text-sm leading-relaxed"></div>
                        </div>
                    </div>

                    <!-- Usage notes -->
                    <div id="usage-notes" class="hidden mt-6 bg-white rounded-2xl shadow-sm border-l-4 border-google-yellow overflow-hidden">
                        <div class="p-5 sm:p-8">
                            <div class="flex items-center gap-2 mb-4">
                                <span class="material-symbols-outlined text-google-yellow">school</span>
                                <h3 class="text-lg font-bold text-gray-900">Usage Guide for Beginners</h3>
                            </div>
                            <div id="usage-notes-content" class="prose max-w-none text-gray-700 text-sm leading-relaxed"></div>
                        </div>
                    </div>

                    <!-- Test button -->
                    <div class="mt-6">
                        <button id="test-btn" onclick="testSkill()"
                            class="px-6 py-3 bg-google-green hover:bg-green-600 active:bg-green-700 text-white font-semibold rounded-xl transition-colors flex items-center gap-2 text-sm">
                            <span class="material-symbols-outlined" style="font-size:20px">science</span>
                            Test Skill
                        </button>
                    </div>

                    <!-- Test results -->
                    <div id="test-results" class="hidden mt-6 bg-white rounded-2xl shadow-sm border-l-4 border-google-green overflow-hidden">
                        <div class="p-5 sm:p-8">
                            <div class="flex items-center gap-2 mb-4">
                                <span class="material-symbols-outlined text-google-green">verified</span>
                                <h3 class="text-lg font-bold text-gray-900">Test Results</h3>
                            </div>
                            <div id="test-content" class="prose max-w-none text-gray-700 text-sm leading-relaxed"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

</div>

<script src="/static/app.js"></script>
</body>
</html>
