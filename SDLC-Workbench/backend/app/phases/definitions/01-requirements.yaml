key: requirements
order: 1
name: Requirements
summary: Capture who the product is for and what it must do.
approver: business engineer
artefacts:
  - key: personas
    name: Personas
    id_prefix: REQ-PER
    role: requirements_analyst
    required: true
    description: Who will use the product and what each of them needs.
  - key: problem_statement
    name: Problem statement
    id_prefix: REQ-PRB
    role: requirements_analyst
    required: true
    description: The problem being solved, in the users' words, and why it matters.
  - key: vision_objectives
    name: Vision and objectives
    id_prefix: REQ-VIS
    role: requirements_analyst
    required: true
    after: [problem_statement]
    description: Where the product is heading and the measurable objectives that say it got there.
  - key: functional_requirements
    name: Functional requirements
    id_prefix: REQ-F
    role: requirements_analyst
    required: true
    after: [personas, problem_statement]
    description: What the product must do, one numbered requirement at a time.
  - key: non_functional_requirements
    name: Non-functional requirements
    id_prefix: REQ-NF
    role: requirements_analyst
    required: true
    after: [problem_statement]
    description: Performance, security, availability and the other qualities the product must have.
  - key: epics_features
    name: Epics and features
    id_prefix: REQ-EPC
    role: requirements_analyst
    required: true
    after: [functional_requirements, non_functional_requirements]
    description: Requirements grouped into epics and features that can be planned and built.
  - key: user_stories
    name: User stories
    id_prefix: REQ-US
    role: backlog_splitter
    after: [epics_features]
    description: Features broken down into small stories with acceptance criteria.
