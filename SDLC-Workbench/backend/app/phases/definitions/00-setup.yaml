# One lifecycle phase. Edit this file to change what the workbench produces; no Python needed.
# Artefact `role` must be a role in app/llm/routing.yaml (the loader checks). `after` lists artefacts
# of THIS phase that must exist first; artefacts that don't wait on each other run in parallel.
key: setup
order: 0
name: Setup
summary: Agree what is being built, for whom, and how the project will run.
approver: business engineer
artefacts:
  - key: project_charter
    name: Project charter
    id_prefix: SET-CHR
    role: orchestrator
    required: true
    description: Scope, goals, constraints, stakeholders and how success will be judged.
