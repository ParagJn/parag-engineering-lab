key: deploy
order: 5
name: Deploy
summary: Plan the release, say what is in it, and check by hand that it worked.
approver: deployment engineer
artefacts:
  - key: deployment_plan
    name: Deployment plan
    id_prefix: DEP-PLN
    role: devops_engineer
    required: true
    description: Where it runs, in what order things happen, and how to go back if it goes wrong.
  - key: release_notes
    name: Release notes
    id_prefix: DEP-REL
    role: devops_engineer
    required: true
    after: [deployment_plan]
    description: What is in this release, in words the business can read.
  - key: deployment_verification
    name: Deployment verification
    id_prefix: DEP-VER
    kind: checklist
    description: Checks a person works through by hand, with a go or no-go for each. No model is used.
  - key: infrastructure_as_code
    name: Infrastructure as code
    id_prefix: DEP-IAC
    role: devops_engineer
    enabled: false
    disabled_reason: Not enabled. The product is built and run outside this tool, so there is nothing for it to describe yet. It can be switched on later.
    description: The container and infrastructure files that describe the environment.
  - key: cicd_pipeline
    name: CI/CD pipeline
    id_prefix: DEP-CI
    role: devops_engineer
    enabled: false
    disabled_reason: Not enabled. No automated build or release is wanted yet. It can be switched on later.
    description: The automated steps that build, test and release the product.
