key: design
order: 2
name: Design
summary: Work out how people will use the product, before deciding how it is built.
approver: business engineer
artefacts:
  - key: user_journey
    name: User journey
    id_prefix: DES-UJ
    role: ux_designer
    required: true
    description: How each persona moves through the product to get something done.
  - key: lowfi_wireframes
    name: Low-fidelity wireframes
    id_prefix: DES-LF
    role: ux_designer
    required: true
    after: [user_journey]
    description: Rough layouts of each screen, to agree structure before visual design.
  - key: hifi_wireframes
    name: High-fidelity wireframes
    id_prefix: DES-HF
    role: ux_designer
    after: [lowfi_wireframes]
    description: Detailed, styled screens ready for the front-end build.
