key: architecture
order: 3
name: Architecture
summary: Decide the parts of the system, how they fit together, and the detail needed to build them.
approver: technical lead
artefacts:
  - key: component_overview
    name: Component overview
    id_prefix: ARC-CMP
    role: solution_architect
    required: true
    description: The main parts of the system and what each one is responsible for.
  - key: high_level_design
    name: High-level design
    id_prefix: ARC-HLD
    role: solution_architect
    required: true
    after: [component_overview]
    description: How the parts fit together, with data, interfaces, technology choices and key decisions.
  - key: low_level_design
    name: Low-level design
    id_prefix: ARC-LLD
    role: solution_architect
    required: true
    after: [high_level_design]
    description: Endpoints, tables and rules detailed enough to build from.
  - key: flow_diagram
    name: Flow diagram
    id_prefix: ARC-FLW
    role: diagram_author
    after: [high_level_design]
    description: A diagram of how a request and its data move through the system.
  - key: usecase_diagram
    name: Use-case diagram
    id_prefix: ARC-UCD
    role: diagram_author
    after: [component_overview]
    description: A diagram of who does what with the system.
